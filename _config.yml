# SITE CONFIGURATION
baseurl: ""                                              # user site (blytheho.github.io), no sub-path
url: "https://blytheho.github.io"                       # your GitHub Pages URL

# THEME-SPECIFIC CONFIGURATION
title: Qijie (Jacquie) He                                        # ← your name or site title
description: "Qijie (Jacquie) He"                      # ← shown in search engines & browser tab
avatar: assets/img/selfieicon.png                         # ← 换成你的照片后改为 assets/img/profile.jpg
favicon: assets/favicon.ico                             # Icon displayed in the tab

# Header and footer text
header_text: ""                                         # ← headline shown on the blog/research listing page
header_feature_image: assets/img/header/triangular.jpeg # ← banner image (or remove this line)
header_feature_image_responsive: true
footer_text: >
  © Qijie (Jacquie) He · Built with <a href="https://jekyllrb.com/">Jekyll</a>

# Blog
excerpt: true                                           # Or "truncate" (first 250 characters), "false" to disable
post_navigation: true
color_image: /assets/img/lineart.png                    # A bit transparent for color posts.

# Features
# More in the _data folder for comments, share buttons, author and language
# For layout customization, go to the "_sass > base" folder, and check "_variables.scss"
katex: true                                             # Enable if using math markup
mermaid: default                                        # Enable mermaid-js for diagrams, use theme: base, forest, dark, default, neutral
google_analytics:                                       # Measurement ID, e.g. "G-00000"
cookie_consent: false                                   # To respect the usage of cookies
color_theme: auto                                       # auto, dark or light

# Card-only Research entries (no detail page): listed on /research/ next to
# _posts, but output: false means Jekyll generates no route for them.
collections:
  research_cards:
    output: false

# PAGINATION
paginate: 5
paginate_path: "/blog/page:num"

# BUILD SETTINGS
sass:
  style: compressed
  quiet_deps: true
plugins: [jekyll-paginate, jekyll-seo-tag, jekyll-feed]
exclude:
  - ".idea"
  - ".jekyll-cache"
  - ".jekyll-metadata"
  - ".sass-cache"
  - "Gemfile"
  - "Gemfile.lock"
  - "type-on-strap.gemspec"
  - "vendor"
  - "node_modules"
  - "assets/node_modules"
  - "assets/Dockerfile"
  - "package.json"
  - "package-lock.json"
  - "README.md"
  - "LICENSE"
  - ".github"
  - "test-results"

# theme: type-on-strap                                  # if using the theme as a jekyll theme gem
remote_theme: sylhare/Type-on-Strap                     # If using as a remote_theme in github
